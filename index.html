<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<title>Vietnam Travel Guide · February 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: poster-style map stage with fixed callout tooltips (scaled to fit) + Top Recommendations column on the right. Single bright light look by design, like the printed guide. */
:root{
  --bg:#eaf3f6; --surface:#ffffff; --ink:#132a4f; --fg:#1d2b33; --muted:#5a6b74; --line:#d6e2e8;
  --star:#f5a623; --pro:#2e9a3e; --con:#d93a2b; --pin:#2457d6; --chip:#f3f7f9;
  --display:"Roboto Slab",Georgia,serif; --body:"Source Sans 3",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1500px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:16px}
h1{font-family:var(--display);font-weight:800;color:var(--ink);font-size:clamp(28px,4vw,46px);line-height:1.05;margin:0;letter-spacing:-.01em}
.month{font-family:var(--display);font-weight:800;color:var(--ink);background:#fff6d8;border:1px solid #f0dca0;border-radius:99px;padding:4px 18px;font-size:clamp(17px,2vw,24px)}
.hint{color:var(--muted);flex-basis:100%;margin:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:1050px){.layout{grid-template-columns:minmax(0,1fr)}}
.stagebox{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 2px 14px rgba(19,42,79,.12);background:#3a9fd8}
.stage{position:absolute;left:0;top:0;width:1200px;height:1320px;transform-origin:0 0}
.stage svg.map{position:absolute;inset:0}
.ctry{fill:#8a7a5c;font:700 22px var(--display);letter-spacing:.22em}
.sea{fill:#1b5a8e;font:italic 700 24px var(--display);letter-spacing:.12em}
.sea.sm{font-size:20px}
.islname{fill:#0f2d5c;font:800 21px var(--display)}
.islsub{fill:#0f2d5c;font:500 17px var(--body)}
.pinpill{font:700 15px var(--body);fill:#132a4f}
.pin{cursor:pointer;outline:none}
.pin .dot{fill:var(--pin);stroke:#fff;stroke-width:3}
.pin.star .dot{fill:var(--star)}
.pin.on .dot{fill:var(--con)}
.pin .ring{fill:none;stroke:var(--con);stroke-width:3;opacity:0}
.pin.on .ring,.pin:focus-visible .ring{opacity:1}
.pin:hover .dot{stroke-width:4}
.tip{position:absolute;width:320px;display:flex;gap:10px;background:rgba(255,255,255,.97);border-radius:12px;padding:8px;box-shadow:0 3px 12px rgba(10,40,70,.22);cursor:pointer;text-align:left;font:inherit;color:inherit;border:2px solid transparent;transition:transform .15s,border-color .15s}
.tip:hover{transform:translateY(-2px);border-color:#9cc2e0}
.tip.on{border-color:var(--con)}
.tip:focus-visible{outline:3px solid var(--con);outline-offset:2px}
.tip img{width:104px;height:84px;object-fit:cover;border-radius:8px;flex:none}
.tip .tx{min-width:0;display:grid;gap:1px;align-content:start}
.tip b{font:800 18px/1.15 var(--display);color:var(--ink);display:flex;gap:6px;align-items:center}
.tip .t{font-size:14.5px;color:#28427a;font-weight:600}
.tip .l{font-size:13.5px;line-height:1.22;display:grid;grid-template-columns:16px 1fr;gap:3px}
.ok{color:var(--pro);font-weight:700}.no{color:var(--con);font-weight:700}
.st{color:var(--star)}
.gtag{justify-self:start;margin-top:3px;background:var(--star);color:#fff;font-weight:700;font-size:12.5px;border-radius:99px;padding:1px 9px}
aside{display:grid;gap:16px}
.box{background:var(--surface);border-radius:16px;box-shadow:0 2px 14px rgba(19,42,79,.10);overflow:hidden}
.boxh{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#fff6d8;border-bottom:1px solid #f0dca0}
.boxh h2{margin:0;font:800 22px var(--display);color:var(--ink)}
.boxh svg{flex:none}
.rec{display:grid;grid-template-columns:110px 34px minmax(0,1fr);gap:12px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.rec:last-child{border-bottom:0}
.rec:hover{background:var(--chip)}
.rec:focus-visible{outline:3px solid var(--con);outline-offset:-3px}
.rec img{width:110px;height:64px;object-fit:cover;border-radius:8px}
.num{width:34px;height:34px;border-radius:50%;background:var(--star);color:#fff;font:800 18px var(--display);display:grid;place-items:center}
.rec strong{font:800 17px var(--display);color:var(--ink)}
.rec p{margin:0;font-size:15px}
.note{padding:14px 18px;font-size:14.5px;display:grid;gap:8px}
.note h3{margin:0;font:800 17px var(--display);color:var(--ink)}
.note p{margin:0}
.note b{color:var(--con)}
.tet{border-top:4px solid var(--con)}
.rec2{background:#fff6d8;border-radius:10px;padding:10px 12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px}
.list .tip{position:static;width:auto}
/* detail dialog */
.ov{position:fixed;inset:0;background:rgba(8,24,44,.55);display:grid;place-items:start center;align-content:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border-radius:18px;width:min(820px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative}
.hero{position:relative}
.hero{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:end;padding:22px 22px 0}
.hero img{display:block;width:100%;height:180px;object-fit:cover;border-radius:12px}
.hero .cap{padding:0 40px 6px 0;color:var(--ink)}
.hero h2{margin:0;font:800 32px/1.1 var(--display)}
.hero .reg{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font:700 22px var(--body);cursor:pointer;color:var(--ink)}
.dbody{padding:18px 22px 22px;display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.temp{font:800 22px var(--display);color:var(--ink)}
.badge{background:var(--star);color:#fff;border-radius:99px;padding:3px 12px;font-weight:700;font-size:13.5px}
.bar{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,#3d8be0,#62c28e 40%,#f2c94c 70%,#e2553e)}
.bar i{position:absolute;top:-5px;bottom:-5px;border:3px solid var(--ink);border-radius:99px}
.sc{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hero.big h2{color:#fff}
@media (max-width:560px){.hero.big img{height:210px}.cols{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero img{height:170px}}
.pane{background:var(--chip);border-radius:12px;padding:12px 14px}
.pane h4{margin:0 0 6px;font:800 15px var(--display)}
.pane ul{margin:0;padding-left:18px}
.pane li+li{margin-top:3px}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.btn{font:700 14.5px var(--body);background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:focus-visible,.x:focus-visible{outline:3px solid var(--con);outline-offset:2px}
.gal{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);gap:10px;overflow-x:auto;padding:16px 22px 4px}
.gt{border:0;background:none;padding:0;cursor:pointer;text-align:left;font:600 13px/1.25 var(--body);color:var(--ink);display:grid;gap:5px}
.gt img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;transition:transform .15s}
.gt:hover img{transform:scale(1.03)}
.gt:focus-visible{outline:3px solid var(--con);outline-offset:2px;border-radius:10px}
.tabs{display:flex;gap:4px;padding:12px 22px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tb{font:700 15px var(--body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tb.on{color:var(--ink);border-bottom-color:var(--star)}
.tb.hl{background:#fff6d8;color:#8a5a00;border-radius:10px 10px 0 0;border:1px solid #f0dca0;border-bottom:3px solid transparent}
.tb.hl.on{background:var(--star);color:#fff;border-color:var(--star)}
.tb:focus-visible{outline:3px solid var(--con)}
.h4{margin:0 0 4px;font:800 15px var(--display)}
.atts{display:grid;gap:12px}
.att{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;align-items:start;background:var(--chip);border-radius:12px;padding:10px}
.att img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block}
.att h4{margin:2px 0 4px;font:800 17px var(--display);color:var(--ink)}
.att p{margin:6px 0 0}
.dur{font-size:13px;font-weight:700;color:#28427a;background:#e3ecf8;border-radius:99px;padding:2px 10px}
@media (max-width:560px){.att{grid-template-columns:1fr}}
.svcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.svcs{grid-template-columns:1fr}}
.svc{background:var(--chip);border-radius:12px;padding:12px 14px}
.svc:last-child{grid-column:1/-1;background:#fff6d8}
.sh{display:flex;gap:8px;align-items:center}
.sh h4{margin:0;font:800 15px var(--display);color:var(--ink)}
.svc p{margin:6px 0 0}
.fine{margin:0;font-size:12px;color:var(--muted)}
.fine a,.att figcaption a{color:var(--muted)}
.hero.big{display:block;padding:0;position:relative}
.hero.big img{height:280px;border-radius:0}
.hero.big .cap{position:absolute;left:0;right:0;bottom:0;padding:50px 22px 14px;background:linear-gradient(transparent,rgba(5,20,40,.78));color:#fff}
.hero.big .reg{color:#fff;opacity:.9}.hero.big .temp{color:#fff}.hero.big .temp svg rect{stroke:#fff}.hero.big .temp svg circle{fill:#fff}
.att figure{margin:0;display:grid;gap:3px}
.att figcaption{font-size:11.5px;color:var(--muted)}
.resin{margin:0 0 10px}
.strip{position:relative;padding-left:30px}
.strip::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:14px;border-radius:8px;background:linear-gradient(90deg,#f3e2b8 0 45%,#3fb0d8 45%)}
.dir{font-size:12.5px;font-weight:700;color:var(--muted);padding:4px 0}
.rl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.rl{grid-template-columns:1fr}}
.rl li{display:flex;gap:10px;align-items:center;background:var(--chip);border-radius:10px;padding:8px 10px}
.rn{flex:none;width:28px;height:28px;border-radius:50%;background:#6b2c8a;color:#fff;font:800 13px var(--display);display:grid;place-items:center}
.rt{display:grid;min-width:0}.rt b{font-size:14.5px;color:var(--ink)}
.rs{font-size:12.5px;color:var(--star)}
.guide{display:grid;gap:14px}
.gbanner{background:linear-gradient(90deg,#fff6d8,#fdeee9);border:1px solid #f0dca0;border-radius:12px;padding:10px 14px;font-weight:700;color:#8a5a00}.guide p{margin:0}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.areas{grid-template-columns:1fr}}
.area{display:grid;grid-template-rows:auto 1fr;text-align:left;font:inherit;color:inherit;background:var(--chip);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;padding:0}
.area:hover{border-color:var(--ink)}.area:focus-visible{outline:3px solid var(--con);outline-offset:2px}
.area img{width:100%;aspect-ratio:16/6;object-fit:cover;display:block}
.area span{padding:10px 12px;display:grid;gap:4px;font-size:14px}.area b{font:800 16px var(--display);color:var(--ink)}
.gh{margin:8px 0 0;font:800 20px var(--display);color:var(--ink);padding-bottom:6px;border-bottom:3px solid var(--star);scroll-margin-top:10px}
.gi{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;background:var(--chip);border-radius:12px;padding:12px}
@media (max-width:560px){.gi{grid-template-columns:1fr}}
.gi figure{margin:0;display:grid;gap:3px;align-content:start}.gi img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.gc{font-size:11.5px;color:var(--muted)}
.gb{display:grid;gap:6px;min-width:0}.gb h5{margin:0;font:800 18px var(--display)}.gb h5 a{color:var(--ink);text-decoration:none}.gb h5 a:hover{text-decoration:underline}
.glink{font-size:13px;font-weight:700;color:#2457d6;justify-self:start}
.gsub{font-weight:700;color:#28427a;font-size:14px}
.gb ul{margin:0;padding-left:18px;display:grid;gap:5px}.gb li a,.food a{color:#2457d6}
.plan,.food,.travel{border-radius:12px;padding:12px 14px}
.plan{background:#fff6d8}.food{background:#fdeee9}.travel{background:#e3f3ea}
.plan h5,.food h5,.travel h5{margin:0 0 8px;font:800 16px var(--display);color:var(--ink)}
.ptip{margin:0 0 10px!important}
.days{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:560px){.days{grid-template-columns:1fr}}
.day{background:#fff;border-radius:10px;padding:10px 12px}.day ul{margin:6px 0 0;padding-left:18px}
.food ul{margin:0;padding-left:18px;display:grid;gap:8px}.travel p+p{margin-top:6px}
footer{margin-top:22px;color:var(--muted);font-size:13px;max-width:80ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

DETAILS.phuquoc.guide={"label":"★ North & South guide","tag":"★ Island guide","intro": ["Phu Quoc is a beautiful island in southern Vietnam, known for its white-sand beaches, clear waters, and tropical charm. The island is mainly divided into two main areas.", "Whether you're into theme parks or scenic views, Phu Quoc's two main areas offer something for every traveler."], "areas": [{"id": "north", "t": "North – VinGroup Area", "img": "pq6a", "d": "The north is developed by VinGroup, featuring top attractions like VinWonders amusement park, Vinpearl Safari, and upscale Vinpearl resorts. It’s ideal for families and travelers looking for entertainment and comfort."}, {"id": "south", "t": "South – SunGroup Area", "img": "pq8a", "d": "The south is where SunGroup has created highlights like the Hon Thom Cable Car and Sun World Hon Thom Park. It offers a relaxed vibe, natural scenery, and Mediterranean-inspired architecture."}], "north": [{"n": "VinWonders", "u": "https://vinwonders.com/en/wonderpedia/news/vinwonders-phu-quoc-the-biggest-theme-park-in-vietnam/", "img": "pq6a", "lead": "VinWonders offers a wide range of exciting attractions and entertainment for all ages:", "b": [["🎢 Amusement Rides", "https://vinwonders.com/en/wonderpedia/news/vinwonders-phu-quoc-rides/", "From thrilling roller coasters, giant drop towers, and Viking-themed river rapids to kid-friendly carousels and fairy-tale playgrounds, the park has over 100 attractions spread across six themed zones."], ["🐠 Aquarium – Neptune’s Palace", "https://vinpearl.com/en/phu-quoc-aquarium-among-the-worlds-largest-aquariums", "This iconic turtle-shaped aquarium is among the world's top 5, home to 300+ marine species and 255,000 sea creatures. Highlights include a shark tunnel, jellyfish zone, coral reefs, and a magical live Mermaid Show — a family favorite."], ["🌊 Water Park – Typhoon World", "https://vinpearl.com/en/discover-vinwonders-phu-quoc-the-largest-theme-park-in-vietnam", "A massive water zone with thrilling slides like Snake Venom, a huge wave pool, lazy rivers, and splash areas for kids."], ["🎇 Fountain Show – “Once Show”", "https://vinwonders.com/en/once-show/", "Held every evening at Phoenix Square, this multimedia water show combines lights, music, fire, lasers, and live performance. It tells a mythical story with stunning effects — a spectacular finale to your visit."]]}, {"n": "Vinpearl Safari", "u": "https://vinwonders.com/en/vinpearl-safari-phu-quoc/", "img": "pq5a", "sub": "Vietnam’s First Open-Zoo Conservation Park", "lead": "Vinpearl Safari Phu Quoc is Vietnam’s first and largest wildlife conservation park, covering over 380 hectares. Designed as an open-zoo, it is home to more than 3,000 animals from 150+ species, many of which are rare or endangered. The park is split into two main zones:", "b": [["🐾 Safari Area", null, "Ride a guided bus through a “reverse zoo” where animals roam freely. Spot lions, giraffes, rhinos, and more in open habitats."], ["🦜 Zoo Area", null, "Explore tree-lined paths and view animals like flamingos, lemurs, and reptiles in spacious enclosures that prioritize animal welfare."]], "after": "Highlights include giraffe feeding, animal shows, a petting zoo for children, and educational programs promoting wildlife conservation. Vinpearl Safari offers a unique and family-friendly adventure that blends entertainment with nature and responsible animal care."}, {"n": "Vin Grand World", "u": "https://vinpearl.com/en/grand-world-phu-quoc-what-is-worth-experiencing-there", "scene": "riverlantern", "sub": "Vietnam’s First 24/7 Entertainment City", "lead": "Vinpearl Grand World Phu Quoc is Vietnam’s first-ever “sleepless city” — a 24/7 destination for culture, entertainment, and unforgettable experiences. Spanning over 85 hectares, it blends European-style architecture, canal-side streets, and lively themed zones inspired by Venice, Indochina, and Shanghai.", "b": [["🏛 Themed Towns & Cultural Streets", null, "Stroll through picturesque neighborhoods filled with colorful facades, bridges, and charming squares. Each area offers unique photo spots, cafes, and small local shops that capture the spirit of both East and West."], ["🎆 Spectacular Light & Water Show", null, "The highlight of Grand World is its nightly light show on the central lake, where fountains, laser beams, 3D mapping, and music combine in a breathtaking performance. With water jets shooting up to 40 meters and vivid projections lighting up the surrounding buildings, the show tells mythical stories in a mesmerizing blend of technology and art — truly a must-see experience."], ["🎭 Cultural & Live Performances", null, "Enjoy large-scale shows like The Quintessence of Vietnam and Charm of Venice, featuring hundreds of dancers, traditional music, and stage effects."], ["🚌 Bonus", null, "Free VinBus shuttles connect Grand World with nearby attractions like VinWonders and Vinpearl Safari."]]}], "plan": {"t": "What to Do in North Phú Quốc – My Personal Tips", "tip": ["🎟️ Tip: Buy the combo ticket for VinWonders + Vinpearl Safari", "More flexibility & allows re-entry to VinWonders"], "days": [["🗓️ Day 1 – VinWonders", ["Explore all rides & attractions", "10 AM: Visit the Aquarium – cool & relaxing", "Don’t miss the Mermaid Show (check schedule)", "Evening: Watch the Water Music Show – beautiful & well done"]], ["🗓️ Day 2 – Vinpearl Safari & Grand World", ["Morning: Vinpearl Safari – open zoo with roaming animals", "Evening: Grand World – check Light & Water Show schedule", "Dine at a spot with a view of the show"]]]}, "food": {"t": "🍴 Must-Try Foods in Phú Quốc", "i": [["Seafood: grilled squid, sea urchin, crab in tamarind", "King Of Seafood – Vua Hải Sản Phú Quốc", "https://maps.app.goo.gl/UCu6EtEMGrxGkRcAA"], ["Bún Quậy Kiến Xây: mix-your-own sauce, fresh noodles cooked on the spot", "Bún Quậy Kiến Xây", "https://maps.app.goo.gl/mwWuew9VgS15tb1e9"]]}, "southLead": "From cable cars to coastal towns, Sun Group delivers unforgettable experiences across South Phú Quốc for families, couples, and adventurers alike.", "south": [{"n": "Hon Thom Cable Car", "u": "https://honthom.sunworld.vn/en/news/the-longest-cable-cars-in-vietnam.html", "img": "pq2a", "lead": "The world’s longest three‑wire sea-crossing cable car (7.9 km), offering spectacular aerial views of the Thanh Toan seascape between An Thoi and Hon Thom islands."}, {"n": "Aquatopia Water Park", "u": "https://honthom.sunworld.vn/en/news/aquatopia-water-park.html", "scene": "island", "lead": "Southeast Asia’s largest water park, opened 2018, featuring over 20 water attractions, themed zones, and easy access via Hon Thom cable car."}, {"n": "Sunset Town", "u": "https://sungroup.com.vn/en/sunsettown", "img": "pq7a", "lead": "A Mediterranean-inspired coastal town with colorful architecture, iconic \"Kiss Bridge,\" clock tower plaza, beach performances, lounges, shops, and live shows year‑round."}, {"n": "Bai Sao Beach", "u": "https://honthom.sunworld.vn/en/news/bai-sao-beach-phu-quoc.html", "img": "pq1a", "lead": "Also called “Star Beach,” this idyllic spot boasts silky white sand, turquoise water, lush palms, jungle backdrop, and snorkeling/kite-surfing opportunities."}], "travel": {"t": "🌴 North & South Phu Quoc – Travel Tip", "i": [["🛣️ Distance", "North and South Phú Quốc are 30–35 km apart. Approx: 1 hour by car."], ["✨ Why visit both?", "Each area offers distinct vibes and must-see attractions — perfect for a well-rounded trip."], ["✅ Tip", "Plan at least 2 full days in each area to enjoy the top experiences without rushing."]]}};
DETAILS.hcm.guide={"label": "★ City guide", "tag": "★ City guide", "banner": "★ Recommended: our personal picks for Ho Chi Minh City.", "sections": [{"id": "cruise", "h": "Luxurious Dining Cruise on the Saigon River", "items": [{"n": "Saigon Princess", "u": "https://www.saigonprincess.com.vn/", "img": "hg_td", "p": ["A luxury dining cruise in Ho Chi Minh City, offering a refined evening experience aboard an elegant river ship. Guests can enjoy a gourmet multi-course dinner with live music, while taking in panoramic views of the Saigon River and city skyline at night. Ideal for special occasions or a unique way to experience the city from the water."]}]}, {"id": "sky", "h": "Sky-High Thrills & Panoramic Views of Ho Chi Minh City", "items": [{"n": "Landmark 81", "u": "https://vinpearl.com/en/landmark-81-vietnam-discover-a-resort-paradise-in-the-clouds-in-saigon", "img": "hg_bh", "p": ["Landmark 81, once the tallest building in Vietnam, is a striking symbol of modern Ho Chi Minh City. With over 141,000 square meters of floor space, it offers a wide range of experiences for visitors."], "b": [["🛍️ Shopping & dining", null, "Explore the Landmark 81 shopping mall, featuring fashion boutiques, restaurants, and a CGV cinema. Dine at well-known restaurants such as Oriental Pearl or Truffle Restaurant, many of which offer stunning city views."], ["🔭 SkyView observatory", null, "Don’t miss the Landmark 81 SkyView observatory. Purchase a ticket to enjoy panoramic views of the city from above."], ["🌳 Vinhomes Central Park", null, "Just outside, take a stroll through Vinhomes Central Park – a beautifully landscaped riverside park perfect for a peaceful walk or photos with the skyline in the background."]]}]}, {"id": "areas", "h": "Neighbourhoods to Explore", "items": [{"n": "District 1", "img": "hg_d1b", "p": ["The historic heart of the city: Nguyen Hue walking street, City Hall, Notre-Dame Cathedral, the Central Post Office, the Opera House and Ben Thanh Market are all within walking distance, with rooftop bars and cafés in between."]}, {"n": "Bui Vien", "img": "hg_bv", "p": ["The famous backpacker street in District 1 turns into a lively walking street in the evening, packed with bars, street food and music. Loud and busy, and great fun for a night out."]}, {"n": "Thao Dien", "scene": "orchard", "p": ["A leafy riverside neighbourhood in Thu Duc City (former District 2), popular with expats for its cafés, international restaurants, boutiques and art spaces. A calm contrast to District 1, with its own Metro Line 1 station."]}]}]};

function leader(p){const [px,py]=P[p.id];const x=p.cx,y=p.cy,w=p.w||CW,h=CH;const c=(v,a,b)=>Math.max(a,Math.min(b,v));let ax,ay,v;
  if(px>x+w){ax=x+w;ay=c(py,y+16,y+h-16);v=1}else if(px<x){ax=x;ay=c(py,y+16,y+h-16);v=1}else if(py<y){ay=y;ax=c(px,x+20,x+w-20);v=0}else{ay=y+h;ax=c(px,x+20,x+w-20);v=0}
  const k=9;return v?`${ax},${ay-k} ${ax},${ay+k} ${px},${py}`:`${ax-k},${ay} ${ax+k},${ay} ${px},${py}`}

function Tip({p,on,onOpen,style}){return html`<button class=${'tip'+(on?' on':'')} style=${style} onClick=${()=>onOpen(p.id)} aria-label=${p.name+', open details'}>

function Detail({p,onClose,onStep,onOpen}){
  const ref=useRef();const [tab,setTab]=useState(DETAILS[p.id].guide?'guide':'overview');const D=DETAILS[p.id];
  useEffect(()=>{setTab(DETAILS[p.id].guide?'guide':'overview');ref.current&&ref.current.focus();const dl=document.querySelector('.dlg');dl&&(dl.scrollTop=0);
    const k=e=>{if(e.key==='Escape')onClose();if(e.key==='ArrowRight')onStep(1);if(e.key==='ArrowLeft')onStep(-1)};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[p.id]);
  const goAtt=i=>{setTab('att');setTimeout(()=>{const el=document.getElementById('att-'+i);el&&el.scrollIntoView({block:'nearest',behavior:'smooth'})},30)};
  const lo=5,hi=35;
  return html`<div class="ov" onClick=${e=>{if(e.target===e.currentTarget)onClose()}}><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt">
    <div class=${'hero'+(PH[p.id]?' big':'')}><img src=${PH[p.id]?photo(PH[p.id]):IMG[p.id]} alt=${p.name}/><div class="cap"><div class="reg">${p.region}</div><h2 id="dt">${p.full||p.name}</h2>
      <div class="row" style=${{marginTop:'8px'}}><span class="temp"><${Therm}/>${p.t[0]}–${p.t[1]}°C</span>${p.star?html`<span class="badge">★ Top recommendation</span>`:null}</div></div>
      <button class="x" ref=${ref} onClick=${onClose} aria-label="Close">×</button></div>
    <div class="gal">${D.att.map((x,i)=>html`<button key=${x.n} class="gt" onClick=${()=>goAtt(i)}><img src=${x.p?photo(x.p):sceneURI(x.s)} alt="" loading="lazy"/><span>${x.n}</span></button>`)}</div>
    <div class="tabs" role="tablist">${(D.guide?[['guide',D.guide.label]]:[]).concat([['overview','Overview'],['att','Attractions ('+D.att.length+')'],['svc','Services']]).concat(D.resorts?[['res','Resorts ('+D.resorts.length+')']]:[]).map(([k,l])=>html`<button key=${k} role="tab" aria-selected=${tab===k} class=${'tb'+(tab===k?' on':'')+(k==='guide'?' hl':'')} onClick=${()=>setTab(k)}>${l}</button>`)}</div>
    <div class="dbody">
    ${tab==='overview'&&html`
      <div><div class="bar"><i style=${{left:(p.t[0]-lo)/(hi-lo)*100+'%',width:(p.t[1]-p.t[0])/(hi-lo)*100+'%'}}></i></div><div class="sc"><span>5°C</span><span>15°C</span><span>25°C</span><span>35°C</span></div></div>
      <div class="cols">
        <div class="pane"><h4 class="ok">✓ Pros</h4><ul>${p.pros.map(x=>html`<li key=${x}>${x}</li>`)}</ul></div>
        <div class="pane"><h4 class="no">– Cons</h4><ul>${p.cons.map(x=>html`<li key=${x}>${x}</li>`)}</ul></div>
      </div>
      <div class="pane" style=${{background:'#fff6d8'}}><h4>Don't miss</h4><ul>${p.see.map(x=>html`<li key=${x}>${x}</li>`)}</ul></div>
      <div class="cols"><div><h4 class="h4">Tip</h4>${p.tip}</div><div><h4 class="h4">Getting there</h4>${p.go}</div></div>`}
    ${tab==='att'&&html`<div class="atts">${D.att.map((x,i)=>html`<article key=${x.n} id=${'att-'+i} class="att"><figure><img src=${x.p?photo(x.p):sceneURI(x.s)} alt=${x.n} loading="lazy"/>${x.p&&!CR[x.p]?html`<figcaption>Bai Dai resort map</figcaption>`:x.p?html`<figcaption><a href=${'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(CR[x.p])} target="_blank" rel="noopener">Photo: Wikimedia Commons</a></figcaption>`:html`<figcaption>Illustration</figcaption>`}</figure><div><h4>${x.n}</h4><span class="dur">⏱ ${x.t}</span><p>${x.d}</p></div></article>`)}</div>`}
    ${tab==='guide'&&D.guide&&html`<${Guide} G=${D.guide}/>`}
    ${tab==='res'&&D.resorts&&html`<div class="res"><p class="resin">Five-star resorts along Bai Dai (Long Beach), numbered from south to north as on the beach map.</p>
      <div class="strip"><div class="dir">↑ North · toward Nha Trang</div>
      <ol class="rl">${D.resorts.map((r,i)=>({...r,i:i+1})).reverse().map(r=>html`<li key=${r.i}><span class="rn">${r.i}</span><span class="rt"><b>${r.n}</b><span class="rs">★★★★★${r.note?' · '+r.note:''}</span></span></li>`)}</ol>
      <div class="dir">↓ South · toward Cam Ranh Airport</div></div></div>`}
    ${tab==='svc'&&html`<div class="svcs">${SVC.map(([k,l])=>html`<div key=${k} class="svc"><div class="sh"><${Ico} k=${k}/><h4>${l}</h4></div><p>${D.svc[k]}</p></div>`)}</div>`}
      <div class="foot"><div style=${{display:'flex',gap:'8px'}}><button class="btn" onClick=${()=>onStep(-1)}>← Previous</button><button class="btn" onClick=${()=>onStep(1)}>Next →</button></div>
        ${p.pair?html`<button class="btn pri" onClick=${()=>onOpen(p.pair)}>Pair with ${BY[p.pair].name} →</button>`:null}</div>
      <p class="fine">${PH[p.id]?html`Header photo: <a href=${'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(CR[PH[p.id]])} target="_blank" rel="noopener">Wikimedia Commons</a> (see the file page for author and licence). `:null}Photos are from Wikimedia Commons; pictures marked "Illustration" are drawings.</p>
    </div></div></div>`;
}

function App(){
  const box=useRef();const [k,setK]=useState(.7);
  const [sel,setSel]=useState(null);
  useLayoutEffect(()=>{const ro=new ResizeObserver(([e])=>setK(e.contentRect.width/W));ro.observe(box.current);return()=>ro.disconnect()},[]);
  useEffect(()=>{const h=location.hash.slice(1);if(BY[h])setSel(h)},[]);
  const open=id=>{setSel(id);try{history.replaceState(null,'','#'+id)}catch(e){}};
  const close=()=>{setSel(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}};
  const step=d=>{const i=PLACES.findIndex(p=>p.id===sel);open(PLACES[(i+d+PLACES.length)%PLACES.length].id)};
  const compact=k<.6;
  return html`<div class="wrap">
    <header><h1>Vietnam Travel Guide</h1><span class="month">February 2027</span><p class="hint">Tap any place on the map or any card to open full details.</p></header>
    <div class="layout">
      <div>
        <div class="stagebox" ref=${box} style=${{height:H*k+'px'}}>
          <div class="stage" style=${{transform:`scale(${k})`}}>
            <${MapSVG} sel=${sel} onOpen=${open} compact=${compact} k=${k}/>
            ${!compact&&PLACES.map(p=>html`<${Tip} key=${p.id} p=${p} on=${sel===p.id} onOpen=${open} style=${{left:p.cx+'px',top:p.cy+'px',width:(p.w||CW)+'px'}}/>`)}
          </div>
        </div>
        ${compact&&html`<div class="list">${PLACES.map(p=>html`<${Tip} key=${p.id} p=${p} on=${sel===p.id} onOpen=${open}/>`)}</div>`}
      </div>
      <aside>
        <div class="box"><div class="boxh"><${Star} s=${28}/><h2>Top Recommendations</h2></div>
          ${TOP.map((t,i)=>html`<button key=${t.id} class="rec" onClick=${()=>open(t.id)}><img src=${IMG[t.img]} alt=${t.name}/><span class="num">${i+1}</span><p><strong>${t.name}</strong> – ${t.why}</p></button>`)}
        </div>
        <div class="box note tet"><h3>Good to know</h3>
          <p>This year, Vietnamese Lunar New Year (Tet) falls on <b>February 6, 2027</b>.</p>
          <p>During this period, many local shops, restaurants, and services may close around Lunar New Year's Eve and the first few days of the new year (roughly <b>February 4–9</b>). After that, popular tourist destinations can become quite crowded as many Vietnamese families travel during the holiday.</p>
          <p>There are some special Tet experiences and cultural tours available for international visitors, but I imagine they may be quite expensive, and I'm not sure about their quality.</p>
          <p class="rec2">For this reason, I would recommend visiting Vietnam after February 9 (ideally from <b>February 10</b> onward). You'll have more options for restaurants, activities, and other services, and it should be easier to plan your trip.</p>
          <p>February weather: cool and misty in the north, mild in the centre, dry and hot in the south.</p>
          <p>Here are some destinations I'd like to recommend.</p>
          <p>Feel free to have a look and choose the places you'd be interested in visiting. I'd be happy to help you explore each destination further and provide more information and recommendations! 😊</p></div>
      </aside>
    </div>
    <footer>Map drawn from real geographic data (Natural Earth, Mercator projection). Hoang Sa (Paracel Islands, Da Nang City) and Truong Sa (Spratly Islands, Khanh Hoa Province) are part of Vietnam. Temperatures are typical February ranges and vary year to year.</footer>
    ${sel&&html`<${Detail} p=${BY[sel]} onClose=${close} onStep=${step} onOpen=${open}/>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body>
</html>
